<!DOCTYPE html><html><head><meta charset="utf-8"><title>DTFF verification</title></head><body>
<pre id="results">pending</pre><div id="frames"></div>
<script>
const PAGES=["/", "/about", "/human-rights", "/governance", "/what-we-do", "/programmes", "/research", "/open-source", "/civil-society", "/children-young-people", "/get-involved", "/support-our-work", "/news", "/contact", "/security", "/credits", "/thank-you", "/divisions/dpi-trust-lab", "/divisions/open-digital-commons", "/divisions/policy-evidence-centre", "/divisions/skills-academy", "/divisions/cyber-safety-centre", "/legal/privacy", "/legal/cookies", "/legal/terms", "/legal/safeguarding"];
const WIDTHS=[360,390,768,1024,1440];
function parse(c){const m=c.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/);return m?{r:+m[1],g:+m[2],b:+m[3],a:m[4]===undefined?1:+m[4]}:null}
function lum(c){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};return 0.2126*f(c.r)+0.7152*f(c.g)+0.0722*f(c.b)}
function ratio(a,b){const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)}
function blend(f,b){const a=f.a;return{r:f.r*a+b.r*(1-a),g:f.g*a+b.g*(1-a),b:f.b*a+b.b*(1-a),a:1}}
function effBg(el,w,base){let n=el,st=[];while(n&&n.nodeType===1){const cs=w.getComputedStyle(n);if(cs.backgroundImage&&cs.backgroundImage!=='none')return{img:true};const bc=parse(cs.backgroundColor);if(bc&&bc.a>0){st.push(bc);if(bc.a===1)break}n=n.parentElement}
 let o=base;for(let i=st.length-1;i>=0;i--)o=blend(st[i],o);return o}
const out=[];const push=(t,c,d)=>out.push((c?'PASS':'FAIL')+' — '+t+(d?'  ['+d+']':''));
function frame(w){const f=document.createElement('iframe');f.style.cssText='border:0;width:'+w+'px;height:900px;display:block';document.getElementById('frames').appendChild(f);return f}
function load(f,src){return new Promise(r=>{f.src=src;f.onload=()=>setTimeout(r,1600)})}
(async()=>{try{
 // ---- horizontal overflow
 let ovf=[];
 for(const w of WIDTHS){const f=frame(w);
   for(const p of PAGES){await load(f,p);const d=f.contentDocument;
     const de=d.documentElement, vw=de.clientWidth, sw=de.scrollWidth;
     if(sw>vw+1){let worst=null;d.querySelectorAll('body *').forEach(el=>{if(el.closest('.table-wrap'))return;const r=el.getBoundingClientRect();if(r.right>vw+1&&(!worst||r.right>worst.right))worst={right:Math.round(r.right),tag:el.tagName,cls:(el.className||'').toString().slice(0,30)}});
       ovf.push(p+'@'+w+' +'+(sw-vw)+'px '+(worst?worst.tag+'.'+worst.cls:''))}}
   f.remove()}
 push('no horizontal overflow at 360/390/768/1024/1440', ovf.length===0, ovf.length?ovf.slice(0,5).join(' | '):(PAGES.length*WIDTHS.length)+' page-widths clean');

 // ---- contrast, structure — both themes
 for(const theme of [(new URLSearchParams(location.search).get('theme')||'light')]){
   const base = theme==='dark' ? {r:8,g:15,b:23,a:1} : {r:247,g:245,b:241,a:1};
   let cfail=[], struct=[];
   const f=frame(1280);
   for(const p of PAGES){await load(f,p);const d=f.contentDocument,w=f.contentWindow;
     // The theme must be baked into the served HTML: setting data-theme after
     // load updates the custom properties but headless Chrome does not always
     // re-resolve them on consuming elements, which produces false failures.
     const active=d.documentElement.getAttribute('data-theme')||'light';
     if(active!==theme){continue}
     d.querySelectorAll('p,li,h1,h2,h3,a,span,td,th,dt,dd,label,button,figcaption,cite,summary,caption,code').forEach(el=>{
       const txt=Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).join('');
       if(!txt||txt.length<3)return;
       const cs=w.getComputedStyle(el);
       if(cs.visibility==='hidden'||cs.display==='none'||+cs.opacity===0)return;
       const fg=parse(cs.color);if(!fg)return;
       const bg=effBg(el,w,base);if(bg.img)return;
       const r=ratio(blend(fg,bg),bg), size=parseFloat(cs.fontSize);
       const need=(size>=24||(size>=18.66&&+cs.fontWeight>=700))?3:4.5;
       if(r<need-0.02)cfail.push(p+' '+el.tagName+'.'+(el.className||'').toString().slice(0,22)+' '+r.toFixed(2)+'<'+need)});
     if(theme==='light'){
       if(d.querySelectorAll('h1').length!==1)struct.push(p+' h1 count='+d.querySelectorAll('h1').length);
       let prev=0;d.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{const l=+h.tagName[1];if(prev&&l>prev+1)struct.push(p+' h'+prev+'->h'+l);prev=l});
       d.querySelectorAll('img').forEach(im=>{if(!im.hasAttribute('alt'))struct.push(p+' img no alt')});
       d.querySelectorAll('a').forEach(a=>{if(!((a.textContent||'').trim()||a.getAttribute('aria-label')||a.querySelector('img')))struct.push(p+' link no name')});
       d.querySelectorAll('input,select,textarea').forEach(i=>{
         // Hidden inputs and the honeypot are not exposed to assistive tech.
         if(i.type==='hidden'||i.getAttribute('aria-hidden')==='true'||w.getComputedStyle(i).display==='none')return;
         if(!(i.id&&d.querySelector('label[for="'+i.id+'"]'))&&!i.closest('label')&&!i.getAttribute('aria-label'))struct.push(p+' input no label: '+(i.name||i.type))});
       if(!d.querySelector('main'))struct.push(p+' no main landmark');
       if(!d.querySelector('.skip-link'))struct.push(p+' no skip link');
       if(!d.querySelector('link[rel=canonical]'))struct.push(p+' no canonical');
       if(!d.querySelector('meta[name=description]'))struct.push(p+' no meta description');
       if(!d.querySelector('script[type="application/ld+json"]'))struct.push(p+' no structured data');
     }}
   f.remove();
   push('WCAG AA contrast — '+theme+' theme', cfail.length===0, cfail.length?cfail.slice(0,6).join(' | '):PAGES.length+' pages clean');
   if(theme==='light')push('document structure, landmarks and metadata', struct.length===0, struct.length?struct.slice(0,6).join(' | '):PAGES.length+' pages clean');
 }
 const fails=out.filter(l=>l.startsWith('FAIL')).length;
 document.getElementById('results').textContent=out.join('\n')+'\n\n'+(out.length-fails)+'/'+out.length+' checks passed';
}catch(e){document.getElementById('results').textContent='THREW: '+e.message+'\n'+out.join('\n')}})();
</script></body></html>
