# Build the React application and publish it to GitHub Pages.
#
# Pages can only serve a branch root or /docs, and the built site lands in
# website/. Publishing through Actions keeps the repository structure intact and
# rebuilds from react-app/ on every push, so the deployed site can never drift
# from its source.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '_src/signature.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Check the build produced what it should
        working-directory: .
        run: |
          fail=0
          for f in website/index.html website/404.html website/sitemap.xml \
                   website/CNAME website/_headers website/robots.txt \
                   website/.well-known/security.txt \
                   website/signature/godfrey-kutumela.html; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done

          # 404.html must be a copy of index.html or client-side routes break:
          # Pages serves it for every path it has no file for.
          if ! cmp -s website/index.html website/404.html; then
            echo "::error::404.html is not a copy of index.html — SPA routes will not resolve"
            fail=1
          fi

          # Stale pages from the previous static site must not linger.
          stale=$(ls website/*.html 2>/dev/null | grep -vE '/(index|404)\.html$' || true)
          if [ -n "$stale" ]; then
            echo "::error::unexpected top-level HTML in website/: $stale"
            fail=1
          fi

          # The custom domain must survive the build, or Pages drops it.
          [ "$(cat website/CNAME)" = "digitaltrustfuturesfoundation.org" ] \
            || { echo "::error::CNAME is wrong: $(cat website/CNAME)"; fail=1; }

          exit $fail

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
